name: Build Redis Cluster
on:
  workflow_dispatch:
    inputs:
      oc_env_suffix:
        description: The environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
permissions:
  contents: read
env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.AUTH_TOKEN_OCP4 }}
  OPENSHIFT_NAMESPACE: ${{ secrets.IOSAS_NAMESPACE_NO_ENV }}-${{ inputs.oc_env_suffix }}
  REPLICAS: 6
jobs:
  create-redis-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4
      - name: init
        run : |
          echo "Initializing..."          
          set -eux
          # Login to OpenShift and select project
          oc login --token=${{ env.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
          oc project ${{ env.OPENSHIFT_NAMESPACE }}
      - name: cleanup
        run : |
          echo "Cleaning up previous installation (if any)..."
          oc delete all,pvc,secret,configmap,sa,rolebinding -l app=redis-ha
      - name: Deploy Redis pods
        run: |
          oc process -f tools/openshift/redis/redis-ha.yaml -p REPLICAS=${{ env.REPLICAS }} | oc apply -f -
      - name: Wait for Readiness
        run: |
          echo "Waiting for pods to be ready..."
          oc rollout status statefulset/redis-ha --timeout=600s
      - name: Create Cluster
        run: |
          echo "Creating Cluster..."
          oc exec -i redis-ha-0 -- redis-cli --cluster create --cluster-replicas 0 $(oc get pods -l app=redis-ha -o jsonpath='{range.items[*]}{.status.podIP}:6379 {end}') --cluster-yes
          echo "Success!"
      - name: Restart backend
        run: |
          echo "Restarting iosas backend..."
          oc rollout restart deployment/api-ecc-iosas
          echo "iosas backend restarted."
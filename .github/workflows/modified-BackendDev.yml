name: Build & Deploy to Backend DEV

env:
  # 🖊️ EDIT your repository secrets to log into your OpenShift cluster and set up the context.
  # See https://github.com/redhat-actions/oc-login#readme for how to retrieve these values.
  # To get a permanent token, refer to https://github.com/redhat-actions/oc-login/wiki/Using-a-Service-Account-for-GitHub-Actions
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  # 🖊️ EDIT to set the kube context's namespace after login. Leave blank to use your user's default namespace.
  OPENSHIFT_NAMESPACE_DEV: ${{ secrets.IOSAS_NAMESPACE }}-dev

  #SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}

  #CA_CERT: ${{ secrets.CA_CERT }}
  #CERTIFICATE: ${{ secrets.CERT }}
  #PRIVATE_KEY: ${{ secrets.PRIV_KEY }}

  # 🖊️ EDIT to change the image registry settings.
  # Registries such as GHCR, Quay.io, and Docker Hub are supported.
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_REGISTRY_USER: ${{ github.actor }}
  IMAGE_REGISTRY_PASSWORD: ${{ github.token }}

  DOCKER_ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca/docker-remote
  ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca

  APP_NAME: "iosas"
  REPO_NAME: "ecc-iosas"
  # grabs the branch name from github dynamically
  BRANCH: ${{ github.ref_name }}
  IMAGE_NAME: iosas-backend
  APP_NAME_BACKEND: "iosas-backend"
  APP_ENVIRONMENT: "dev"
  APP_FOLDER: "backend"
  NAMESPACE: ${{ secrets.IOSAS_NAMESPACE }}
  NAMESPACE_TOOLS: ${{ secrets.IOSAS_NAMESPACE }}-tools
  TAG: "latest"

  MIN_REPLICAS: "1"
  MAX_REPLICAS: "2"
  MIN_CPU: "300m"
  MAX_CPU: "600m"
  MIN_MEM: "250Mi"
  MAX_MEM: "500Mi"
  # SITE_URL should have no scheme or port. It will be prepended with https://
  HOST_ROUTE: ${{ secrets.SITE_URL }}

on:
  push:
    branches:
      - ModifiedDevYmlDeployScript

jobs:
  build-and-deploy-dev:
    name: Build and deploy Backend to DEV
    # ubuntu-latest can also be used.
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}

    steps:
      - name: Check for required secrets
        uses: actions/github-script@v6
        with:
          script: |
            const secrets = {
              OPENSHIFT_SERVER: `${{ secrets.OPENSHIFT_SERVER }}`,
              OPENSHIFT_TOKEN: `${{ secrets.OPENSHIFT_TOKEN }}`,
            };
            
            const GHCR = "ghcr.io";
            if (`${{ env.IMAGE_REGISTRY }}`.startsWith(GHCR)) {
              core.info(`Image registry is ${GHCR} - no registry password required`);
            }
            else {
              core.info("A registry password is required");
              secrets["IMAGE_REGISTRY_PASSWORD"] = `${{ env.IMAGE_REGISTRY_PASSWORD }}`;
            }
            
            const missingSecrets = Object.entries(secrets).filter(([ name, value ]) => {
              if (value.length === 0) {
                core.error(`Secret "${name}" is not set`);
                return true;
              }
              core.info(`✔️ Secret "${name}" is set`);
              return false;
            });
            
            if (missingSecrets.length > 0) {
              core.setFailed(`❌ At least one required secret is not set in the repository. \n` +
                "You can add it using:\n" +
                "GitHub UI: https://docs.github.com/en/actions/reference/encrypted-secrets#creating-encrypted-secrets-for-a-repository \n" +
                "GitHub CLI: https://cli.github.com/manual/gh_secret_set \n" +
                "Also, refer to https://github.com/redhat-actions/oc-login#getting-started-with-the-action-or-see-example");
            }
            else {
              core.info(`✅ All the required secrets are set`);
            }

      - name: Check out repository with branch [${{ env.BRANCH }}]
        uses: actions/checkout@v4
        with:
          ref: ${{env.BRANCH}}

      - name: Determine app name
        if: env.APP_NAME_BACKEND == ''
        run: |
          echo "APP_NAME_BACKEND=$(basename $PWD)" | tee -a $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_ARTIFACTORY_REPO }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # https://github.com/redhat-actions/buildah-build#readme
      - name: Build backend from Dockerfile
        id: build-image-backend
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: "latest"

          # If you don't have a Dockerfile/Containerfile, refer to https://github.com/redhat-actions/buildah-build#scratch-build-inputs
          # Or, perform a source-to-image build using https://github.com/redhat-actions/s2i-build
          # Otherwise, point this to your Dockerfile/Containerfile relative to the repository root.
          dockerfiles: |
            ./${{APP_FOLDER}}/Dockerfile
          context: ./backend

        # https://github.com/redhat-actions/push-to-registry#readme
      - name: Push backend to registry
        id: push-image-backend
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image-backend.outputs.image }}
          tags: ${{ steps.build-image-backend.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY_USER }}
          password: ${{ env.IMAGE_REGISTRY_PASSWORD }}

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4

        # https://github.com/redhat-actions/oc-login#readme
      - uses: actions/checkout@v3
      - name: Deploy
        run: |
          set -eux
          echo "Deploying to to dev from branch: ${{ env.BRANCH }}"
          # Login to OpenShift and select project
          oc login --token=${{ env.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
          oc project ${{ env.OPENSHIFT_NAMESPACE_DEV }}
          # Cancel any rollouts in progress
          oc rollout cancel dc/${{ env.IMAGE_NAME }} 2> /dev/null \
          || true && echo "No rollout in progress"
          
          # Create the image stream if it doesn't exist
          oc create imagestream ${{ env.REPO_NAME }}-backend-${{ env.BRANCH }} 2> /dev/null || true && echo "Backend image stream in place"
          
          oc tag ${{ steps.push-image-backend.outputs.registry-path }} ${{ env.REPO_NAME }}-backend-${{ env.BRANCH }}:${{ env.TAG }}
          
          # Process and apply deployment template
          oc process -f tools/openshift/backend.dc.yaml \
          -p APP_NAME=${{ env.APP_NAME }} \
          -p REPO_NAME=${{ env.REPO_NAME }} \
          -p BRANCH=${{ env.BRANCH }} \
          -p NAMESPACE=${{ env.OPENSHIFT_NAMESPACE_DEV }} \
          -p TAG=${{ env.TAG }} \
          -p MIN_REPLICAS=${{ env.MIN_REPLICAS }} \
          -p MAX_REPLICAS=${{ env.MAX_REPLICAS }} \
          -p MIN_CPU=${{ env.MIN_CPU }} \
          -p MAX_CPU=${{ env.MAX_CPU }} \
          -p MIN_MEM=${{ env.MIN_MEM }} \
          -p MAX_MEM=${{ env.MAX_MEM }} \
          -p HOST_ROUTE=${{ env.HOST_ROUTE }} \
          -p APP_ENVIRONMENT=${{ env.APP_ENVIRONMENT }} \
          | oc apply -f -
          
          curl -s https://raw.githubusercontent.com/bcgov/${{ env.REPO_NAME }}/tools/config/update-configmap.sh | bash /dev/stdin \
          ${{ env.APP_ENVIRONMENT }} \
          ${{ env.APP_NAME }} \
          ${{ env.NAMESPACE }} \
          ${{ env.COMMON_NAMESPACE }} \
          ${{ secrets.SOAM_CLIENT_ID }} \
          ${{ secrets.SOAM_CLIENT_SECRET }} \
          ${{ secrets.REDIS_PASSWORD }} \
          ${{ secrets.D365_API_PREFIX }} 
          
          # Start rollout (if necessary) and follow it
          oc rollout latest dc/${{ env.IMAGE_NAME }} 2> /dev/null \
          || true && echo "Rollout in progress"
          
          # Get status, returns 0 if rollout is successful
          oc rollout status dc/${{ env.IMAGE_NAME }}

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://${{ env.HOST_ROUTE }}'